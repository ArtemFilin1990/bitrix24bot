name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - 'inbox/**'
  workflow_dispatch:
    inputs:
      cf_token:
        description: 'Cloudflare API Token (overrides secret)'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify wrangler.toml configuration
        run: |
          echo "Checking wrangler.toml exists..."
          ls -la wrangler.toml
          echo "Main entry point:"
          grep "^main" wrangler.toml
          echo "Verifying worker.js exists:"
          ls -la b24-imbot/worker.js

      - name: Install Wrangler
        run: npm install -g wrangler@4.77.0

      - name: Deploy Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ github.event.inputs.cf_token || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Worker secrets
        if: |
          secrets.B24_PORTAL != '' ||
          secrets.B24_USER_ID != '' ||
          secrets.B24_TOKEN != '' ||
          secrets.B24_APP_TOKEN != '' ||
          secrets.BOT_ID != '' ||
          secrets.GEMINI_API_KEY != '' ||
          secrets.IMPORT_SECRET != '' ||
          secrets.WORKER_HOST != ''
        run: |
          set_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "$value" | wrangler secret put "$name"
              echo "✓ $name updated"
            fi
          }
          set_secret B24_PORTAL     "$B24_PORTAL"
          set_secret B24_USER_ID    "$B24_USER_ID"
          set_secret B24_TOKEN      "$B24_TOKEN"
          set_secret B24_APP_TOKEN  "$B24_APP_TOKEN"
          set_secret BOT_ID         "$BOT_ID"
          set_secret GEMINI_API_KEY "$GEMINI_API_KEY"
          set_secret IMPORT_SECRET  "$IMPORT_SECRET"
          set_secret WORKER_HOST    "$WORKER_HOST"
        env:
          CLOUDFLARE_API_TOKEN: ${{ github.event.inputs.cf_token || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B24_PORTAL:    ${{ secrets.B24_PORTAL }}
          B24_USER_ID:   ${{ secrets.B24_USER_ID }}
          B24_TOKEN:     ${{ secrets.B24_TOKEN }}
          B24_APP_TOKEN: ${{ secrets.B24_APP_TOKEN }}
          BOT_ID:        ${{ secrets.BOT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMPORT_SECRET: ${{ secrets.IMPORT_SECRET }}
          WORKER_HOST:   ${{ secrets.WORKER_HOST }}
