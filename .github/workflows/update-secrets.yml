name: Update Worker Secrets

on:
  workflow_dispatch:
    inputs:
      b24_token:
        description: 'Bitrix24 REST webhook token (B24_TOKEN)'
        required: true
      b24_user_id:
        description: 'Bitrix24 REST user ID (B24_USER_ID, default: 1)'
        required: false
        default: ''

jobs:
  update-secrets:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wrangler
        run: npm install -g wrangler@4.77.0

      - name: Update B24_TOKEN
        run: printf '%s' "$INPUT_TOKEN" | wrangler secret put B24_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_TOKEN: ${{ github.event.inputs.b24_token }}

      - name: Update B24_USER_ID (if provided)
        if: ${{ github.event.inputs.b24_user_id != '' }}
        run: printf '%s' "$INPUT_UID" | wrangler secret put B24_USER_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_UID: ${{ github.event.inputs.b24_user_id }}

      - name: Confirm secrets updated
        run: wrangler secret list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
